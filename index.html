<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Home Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Pretendard,Arial,sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
body{
  background:#000;
  min-height:100%;
}

#normal{
  width:100%;min-height:100vh;
  padding:clamp(22px,4vw,64px);
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:28px;
  background:#000
}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{color:#777;letter-spacing:.18em;font-size:clamp(14px,1.3vw,20px)}
.date{color:#aaa;text-align:right;font-size:clamp(16px,1.8vw,28px);line-height:1.5}
.center{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(330px,38vw);
  gap:40px;
  align-items:center;
  min-height:0;
}
.clock{
  font-size:clamp(92px,16vw,235px);
  font-weight:700;
  letter-spacing:-.065em;
  line-height:.92;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.sec{
  display:inline-block;
  font-size:.24em;
  color:#3c3c3c;
  vertical-align:top;
  margin-left:.28em;
  margin-top:.10em;
  letter-spacing:0;
  font-weight:500;
}
.sub{margin-top:24px;color:#777;font-size:clamp(17px,1.7vw,28px)}
.card{
  padding:26px 28px;border:1px solid #1b1b1b;
  border-radius:26px;background:#080808;margin-bottom:18px
}
.label{color:#666;font-size:13px;letter-spacing:.18em;margin-bottom:18px}
.temp{font-size:64px;font-weight:700}
.desc{color:#bbb;font-size:22px}
.meta{color:#666;margin-top:12px;font-size:14px;line-height:1.6}
.headline{
  font-family:"Noto Sans KR",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(24px,2.2vw,36px);
  font-weight:600;
  letter-spacing:-.025em;
  line-height:1.42;
  min-height:118px;
  display:flex;
  align-items:center;
  opacity:1;
  transform:translateY(0);
  transition:opacity .42s ease, transform .42s cubic-bezier(.22,1,.36,1);
  will-change:opacity,transform;
}
.headline.is-changing{
  opacity:0;
  transform:translateY(10px);
}
.source{
  color:#555;
  margin-top:16px;
  font-size:13px;
  transition:opacity .35s ease;
}
.source.is-changing{opacity:0}
.bottom{
  display:flex;justify-content:space-between;align-items:center;
  color:#444;font-size:13px
}
.btn{
  border:1px solid #222;background:#080808;color:#777;
  border-radius:999px;padding:10px 15px;cursor:pointer
}
.btn:hover{color:#fff;border-color:#444}

/* 일반 화면 하단 수면모드 호버 버튼 */
.sleep-hover-zone{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
}
.sleep-hover-btn{
  border:1px solid #242424;
  background:rgba(8,8,8,.94);
  color:#777;
  border-radius:999px;
  padding:9px 16px;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
}
.sleep-hover-btn:hover{color:#fff;border-color:#444}

/* 수면모드 */
#sleep{
  display:none;width:100%;height:100%;
  background:#000;align-items:center;justify-content:center;
  position:relative
}
.sleepwrap{text-align:center;transform:translateY(-2vh)}
#sleepClock{
  color:#2d2d2d;
  font-size:clamp(88px,18vw,245px);
  font-weight:200;
  letter-spacing:-.045em;
  line-height:1;
  font-variant-numeric:tabular-nums
}
#sleepWeather{
  margin-top:22px;color:#242424;
  font-size:clamp(13px,1.3vw,20px);
  font-weight:300
}
.return-wrap{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  z-index:20;
}
.return-btn{
  border:1px solid #2d2d2d;
  background:#090909;
  color:#2d2d2d;
  font-size:12px;
  font-weight:400;
  padding:9px 16px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}
.return-btn:hover{
  color:#4a4a4a;
  border-color:#4a4a4a;
  background:#0d0d0d;
}

@media(max-width:900px){
  #normal{
    height:auto;
    min-height:100vh;
    padding-bottom:90px;
  }
  .center{grid-template-columns:1fr;align-items:start}
  .clock{font-size:24vw}
  .card{margin-bottom:16px}
}
</style>

<style>
  button{-webkit-tap-highlight-color:transparent}
  .card{touch-action:pan-y}
  #normal{overscroll-behavior-y:contain}
</style>

</head>
<body>

<main id="normal">
  <div class="top">
    <div class="brand">HOME DASHBOARD</div>
    <div class="date" id="date"></div>
  </div>

  <div class="center">
    <div>
      <div class="clock">
        <span id="hm">00:00</span><span class="sec" id="sec">00</span>
      </div>
      <div class="sub" id="greet"></div>
    </div>

    <div>
      <div class="card">
        <div class="label">WEATHER</div>
        <div class="temp" id="temp">--°</div>
        <div class="desc" id="desc">날씨 불러오는 중</div>
        <div class="meta" id="meta"></div>
      </div>

      <div class="card">
        <div class="label">LATEST HEADLINES</div>
        <div class="headline" id="headline">뉴스를 불러오는 중...</div>
        <div class="source" id="source">Google News</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <span id="status">날씨 · 뉴스 자동 갱신</span>
    <button class="btn" id="fs">전체화면</button>
  </div>
</main>

<div class="sleep-hover-zone" id="sleepHoverZone">
  <button class="sleep-hover-btn" id="manualSleepBtn">수면모드</button>
</div>

<main id="sleep">
  <div class="sleepwrap">
    <div id="sleepClock">00:00</div>
    <div id="sleepWeather">--° · 날씨 불러오는 중</div>
  </div>
  <div class="return-wrap">
    <button class="return-btn" id="returnNormalBtn">기존 모드로 돌아가기</button>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);

let manualMode = null; // null=자동, "normal"=일반 강제, "sleep"=수면 강제

function isSleepTime(d){
  const h=d.getHours();
  return h>=0 && h<7;
}

function setMode(mode){
  const normal = mode === 'normal';
  $('normal').style.display = normal ? 'grid' : 'none';
  $('sleep').style.display = normal ? 'none' : 'flex';
  $('sleepHoverZone').style.display = normal ? 'flex' : 'none';
}

function evaluateMode(){
  if(manualMode === 'normal'){
    setMode('normal');
    return;
  }
  if(manualMode === 'sleep'){
    setMode('sleep');
    return;
  }
  setMode(isSleepTime(new Date()) ? 'sleep' : 'normal');
}

$('manualSleepBtn').onclick=()=>{
  manualMode='sleep';
  setMode('sleep');
};

$('returnNormalBtn').onclick=()=>{
  manualMode='normal';
  setMode('normal');
};

/* 날짜가 바뀌면 수동 강제 상태를 자동 해제해서 다음 밤에는 다시 자동 전환 */
let lastDateKey = new Date().toDateString();

function tick(){
  const d=new Date();
  const dateKey=d.toDateString();

  if(dateKey !== lastDateKey){
    manualMode=null;
    lastDateKey=dateKey;
  }

  const h=d.getHours();
  const t=d.toLocaleTimeString('ko-KR',{
    hour:'2-digit',minute:'2-digit',hour12:false
  });

  $('hm').textContent=t;
  $('sleepClock').textContent=t;
  $('sec').textContent=String(d.getSeconds()).padStart(2,'0');

  $('date').innerHTML=
    d.toLocaleDateString('ko-KR',{
      year:'numeric',month:'long',day:'numeric'
    })+'<br>'+
    d.toLocaleDateString('ko-KR',{weekday:'long'});

  $('greet').textContent=
    h<6?'늦은 밤이에요.':
    h<12?'좋은 아침이에요.':
    h<18?'좋은 오후예요.':
    '좋은 저녁이에요.';

  evaluateMode();
}
tick();
setInterval(tick,1000);

function wtext(c){
  if(c===0)return'맑음';
  if([1,2].includes(c))return'대체로 맑음';
  if(c===3)return'흐림';
  if([45,48].includes(c))return'안개';
  if([51,53,55,56,57].includes(c))return'이슬비';
  if([61,63,65,66,67,80,81,82].includes(c))return'비';
  if([71,73,75,77,85,86].includes(c))return'눈';
  if([95,96,99].includes(c))return'뇌우';
  return'날씨 정보';
}

async function weather(lat,lon,name){
  try{
    const u=
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&timezone=auto`;

    const j=await (await fetch(u,{cache:'no-store'})).json();
    const c=j.current;
    const ds=wtext(c.weather_code);
    const tt=Math.round(c.temperature_2m);

    $('temp').textContent=tt+'°';
    $('desc').textContent=ds;
    $('meta').textContent=
      `${name} · 체감 ${Math.round(c.apparent_temperature)}° · 습도 ${c.relative_humidity_2m}% · 바람 ${Math.round(c.wind_speed_10m)}km/h`;

    $('sleepWeather').textContent=`${tt}° · ${ds}`;
  }catch(e){
    $('desc').textContent='날씨 정보를 불러오지 못했어요';
    $('sleepWeather').textContent='날씨 정보 없음';
  }
}

function initWeather(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>weather(p.coords.latitude,p.coords.longitude,'현재 위치'),
      ()=>weather(37.5665,126.9780,'서울'),
      {timeout:7000,maximumAge:900000}
    );
  }else{
    weather(37.5665,126.9780,'서울');
  }
}
initWeather();
setInterval(initWeather,900000);

let news=[{title:'대시보드가 준비되었습니다.',source:'Home Dashboard'}],ni=0;

let newsChanging=false;
function showNews(){
  if(newsChanging || !news.length) return;
  newsChanging=true;

  const headline=$('headline');
  const source=$('source');

  headline.classList.add('is-changing');
  source.classList.add('is-changing');

  setTimeout(()=>{
    headline.textContent=news[ni].title;
    source.textContent=news[ni].source||'News';

    requestAnimationFrame(()=>{
      headline.classList.remove('is-changing');
      source.classList.remove('is-changing');
      setTimeout(()=>{ newsChanging=false; },430);
    });
  },420);
}

async function loadNews(){
  try{
    const rss=encodeURIComponent(
      'https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko'
    );
    const j=await (
      await fetch('https://api.rss2json.com/v1/api.json?rss_url='+rss)
    ).json();

    if(j.items?.length){
      news=j.items.slice(0,12).map(x=>{
        let title=x.title||'';
        let source='Google News';
        const m=title.match(/\s-\s([^\-]+)$/);
        if(m){
          source=m[1].trim();
          title=title.replace(/\s-\s([^\-]+)$/,'').trim();
        }
        return {title,source};
      });
      ni=0;
      showNews();
      $('status').textContent='날씨 · 뉴스 업데이트 완료';
    }
  }catch(e){
    showNews();
  }
}

loadNews();
setInterval(loadNews,900000);
setInterval(()=>{
  ni=(ni+1)%news.length;
  showNews();
},7000);

$('fs').onclick=()=>{
  document.documentElement.requestFullscreen?.();
};

// 터치 스크롤을 방해하지 않도록 자동 전체화면 진입은 하지 않습니다.
// 필요할 때 아래 '전체화면' 버튼으로 진입합니다.
</script>
</body>
</html>
